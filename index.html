<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="main">
      <section class="allElems">
        <div class="todo elems" id="0">
          <img src="./todo.jpg" alt="" />
          <h2>Todo List</h2>
        </div>
        <div class="daily elems" id="1">
          <img src="./moti.avif" alt="" />
          <h2>Daily Task</h2>
        </div>
        <div class="moti elems" id="2">
          <img src="./promo.avif" alt="" />
          <h2>Motivation Quotes</h2>
        </div>
        <div class="pomo elems" id="3">
          <img src="./hello.avif" alt="" />
          <h2>Pomodoro Timer</h2>
        </div>
        <div class="goals elems" id="4">
          <img src="./goal.avif" alt="" />
          <h2>Daily Goals</h2>
        </div>
      </section>
      <section class="fullElem todo-list-fullPage">
        <button class="back" id="0">
            <i class="ri-close-large-line"></i></button>
       <h2>Your Personalized Task List</h2>
        <div class="todo-container">
            <div class="addTask">
                <form>
                    <input id="task-input" type="text" placeholder="Enter Your Task">
                    <textarea placeholder="Enter Details"  name="" id=""></textarea>
                    <div class="mark-as-imp">
                        <input type="checkbox" name="checkbox" id="check">
                        <label for="check">Mark as Important!</label>
                    </div>
                    <button>Add Tasks</button>
                </form>
            </div>
            <div class="allTask">
                
            </div>
        </div>
      </section>
      <section class="fullElem daily-planner-fullPage">
        <button class="back" id="1">
          <i class="ri-close-large-line"></i>
        </button>
        <h1>Daily planner</h1>
      </section>
      <section class="fullElem motivational-quotes-fullPage">
        <button class="back" id="2">
          <i class="ri-close-large-line"></i>
        </button>
        <h1>Motivational Quotes</h1>
      </section>
      <section class="fullElem pomodoro-timer-fullPage">
        <button class="back" id="3">
          <i class="ri-close-large-line"></i>
        </button>
        <h1>Pomodoro Timer</h1>
      </section>
      <section class="fullElem daily-goals-fullPage">
        <button class="back" id="4">
          <i class="ri-close-large-line"></i>
        </button>
        <h1>Daily Goals</h1>
      </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
